<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__TITLE__</title>
  <script>
    (function () {
      const stored = localStorage.getItem('theme') || 'auto';
      const resolved = stored === 'auto'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : stored;
      document.documentElement.setAttribute('data-bs-theme', resolved);
      document.documentElement.setAttribute('data-theme-preference', stored);
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css?v=1">
  <style>
    .terminal-card {
      border-color: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .terminal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.75rem 1rem;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .terminal-header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
    }

    .terminal-dots {
      display: inline-flex;
      gap: 0.375rem;
      flex-shrink: 0;
    }

    .terminal-dot {
      width: 0.75rem;
      height: 0.75rem;
      border-radius: 999px;
      display: inline-block;
    }

    .terminal-dot.red { background: #ff5f57; }
    .terminal-dot.yellow { background: #febc2e; }
    .terminal-dot.green { background: #28c840; }

    .terminal-title-wrap {
      min-width: 0;
    }

    .terminal-subtitle {
      font-size: 0.75rem;
      color: var(--tblr-secondary);
    }

    .terminal-surface {
      background: #111827;
      color: #e5e7eb;
    }

    .terminal-output {
      color: inherit;
    }

    .brand-link {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: inherit;
      text-decoration: none;
    }

    .brand-icon {
      color: var(--tblr-secondary);
      line-height: 1;
    }

    .brand-icon .ti {
      font-size: 2rem;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.1;
    }

    .brand-subtitle {
      color: var(--tblr-secondary);
      font-size: 0.8125rem;
      line-height: 1.2;
      margin-top: 0.125rem;
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="navbar navbar-expand-md d-print-none">
      <div class="container-xl">
        <h1 class="navbar-brand navbar-brand-autodark pe-0 pe-md-3 m-0">
          <a href="./ui" class="brand-link">
            <span class="brand-icon" aria-hidden="true"><i class="ti ti-file-text"></i></span>
            <span>
              <span class="brand-title">nginx-ui-logs</span>
              <span class="brand-subtitle d-block">Nginx access/error log viewer</span>
            </span>
          </a>
        </h1>
        <div class="navbar-nav flex-row order-md-last align-items-center">
          <div class="btn-list me-3">
            <button type="button" id="pause-btn" class="btn btn-outline-danger btn-sm">
              <i class="ti ti-player-pause me-1"></i>Pause
            </button>
            <span id="sse-status" class="badge bg-green-lt text-green-fg">
              <i class="ti ti-activity-heartbeat me-1"></i>LIVE
            </span>
            <div class="btn-group" role="group">
              <a id="download-access" href="access.log.gz" class="btn btn-outline-secondary btn-sm">
                <i class="ti ti-download me-1"></i>Access
              </a>
              <button type="button" class="btn btn-outline-secondary btn-sm copy-url-btn" data-href="access.log.gz" title="Copy access download URL" aria-label="Copy access download URL"><i class="ti ti-copy me-1"></i>Copy URL</button>
            </div>
            <div class="btn-group" role="group">
              <a id="download-error" href="error.log.gz" class="btn btn-outline-secondary btn-sm">
                <i class="ti ti-download me-1"></i>Error
              </a>
              <button type="button" class="btn btn-outline-secondary btn-sm copy-url-btn" data-href="error.log.gz" title="Copy error download URL" aria-label="Copy error download URL"><i class="ti ti-copy me-1"></i>Copy URL</button>
            </div>
          </div>
          <div class="nav-item dropdown">
            <a href="#" class="nav-link px-2" data-bs-toggle="dropdown" aria-label="Theme">
              <i class="ti ti-palette"></i>
            </a>
            <div class="dropdown-menu dropdown-menu-end">
              <a class="dropdown-item js-theme-option" href="#" data-theme-value="auto">Auto</a>
              <a class="dropdown-item js-theme-option" href="#" data-theme-value="light">Light</a>
              <a class="dropdown-item js-theme-option" href="#" data-theme-value="dark">Dark</a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="page-wrapper">
      <div class="page-body">
        <div class="container-xl">
          <div class="row row-cards mb-3">
            <div class="col-12">
              <div class="card">
                <div class="card-body">
                  <form id="controls-form" class="row gx-3 gy-2 align-items-center">
                    <div class="col-xl-2 col-lg-3">
                      <label class="form-label mb-1">Lines/log</label>
                      <select name="limit" id="limit" class="form-select">
                        __LIMIT_OPTIONS__
                      </select>
                    </div>
                    <div class="col-xl-2 col-lg-3">
                      <label class="form-label mb-1">Refresh</label>
                      <select name="refresh" id="refresh" class="form-select">
                        __REFRESH_OPTIONS__
                      </select>
                    </div>
                    <div class="col-xl-4 col-lg-6">
                      <label class="form-label mb-1">Filter</label>
                      <input id="log-filter" class="form-control" type="text" placeholder="substring, e.g. 10.220.18.2">
                    </div>
                    <div class="col-xl-2 col-lg-3 col-sm-6">
                      <label class="form-label mb-1 d-block">Numbers</label>
                      <label class="form-check form-switch mb-0">
                        <input type="checkbox" class="form-check-input" id="line-numbers">
                        <span class="form-check-label">On</span>
                      </label>
                    </div>
                    <div class="col-xl-2 col-lg-3 col-sm-6">
                      <label class="form-label mb-1 d-block">Wrap</label>
                      <label class="form-check form-switch mb-0">
                        <input type="checkbox" class="form-check-input" id="wrap-lines">
                        <span class="form-check-label">On</span>
                      </label>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>

          <div class="row row-cards">
            <div class="col-12">
              <div class="card terminal-card terminal-surface">
                <div class="terminal-header">
                  <div class="terminal-header-left">
                    <div class="terminal-dots" aria-hidden="true">
                      <span class="terminal-dot red"></span>
                      <span class="terminal-dot yellow"></span>
                      <span class="terminal-dot green"></span>
                    </div>
                    <div class="terminal-title-wrap">
                      <div>access.log <span class="terminal-subtitle">(latest <span id="access-limit-label">__LIMIT__</span> lines)</span></div>
                    </div>
                  </div>
                  <div class="card-actions">
                    <button type="button" class="btn btn-outline-secondary btn-sm copy-log-btn" data-target="access-log" title="Copy visible access.log" aria-label="Copy visible access.log"><i class="ti ti-copy me-1"></i>Copy log</button>
                  </div>
                </div>
                <div class="card-body p-0 terminal-surface">
                  <pre id="access-log" class="m-0 p-3 small terminal-output" style="height: 35vh; overflow: auto; white-space: pre; tab-size: 4; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, Courier New, monospace;">__ACCESS__</pre>
                </div>
              </div>
            </div>

            <div class="col-12">
              <div class="card terminal-card terminal-surface">
                <div class="terminal-header">
                  <div class="terminal-header-left">
                    <div class="terminal-dots" aria-hidden="true">
                      <span class="terminal-dot red"></span>
                      <span class="terminal-dot yellow"></span>
                      <span class="terminal-dot green"></span>
                    </div>
                    <div class="terminal-title-wrap">
                      <div>error.log <span class="terminal-subtitle">(latest <span id="error-limit-label">__LIMIT__</span> lines)</span></div>
                    </div>
                  </div>
                  <div class="card-actions">
                    <button type="button" class="btn btn-outline-secondary btn-sm copy-log-btn" data-target="error-log" title="Copy visible error.log" aria-label="Copy visible error.log"><i class="ti ti-copy me-1"></i>Copy log</button>
                  </div>
                </div>
                <div class="card-body p-0 terminal-surface">
                  <pre id="error-log" class="m-0 p-3 small terminal-output" style="height: 35vh; overflow: auto; white-space: pre; tab-size: 4; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, Courier New, monospace;">__ERROR__</pre>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script defer src="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/js/tabler.min.js"></script>
  <script>
    (function () {
      'use strict';

      const limitSelect = document.getElementById('limit');
      const refreshSelect = document.getElementById('refresh');
      const filterInput = document.getElementById('log-filter');
      const lineNumberCheckbox = document.getElementById('line-numbers');
      const wrapLinesCheckbox = document.getElementById('wrap-lines');
      const accessPre = document.getElementById('access-log');
      const errorPre = document.getElementById('error-log');
      const pauseBtn = document.getElementById('pause-btn');
      const accessLimitLabel = document.getElementById('access-limit-label');
      const errorLimitLabel = document.getElementById('error-limit-label');
      const sseStatus = document.getElementById('sse-status');

      const themeOptions = document.querySelectorAll('.js-theme-option');
      const applyTheme = (theme) => {
        const resolved = theme === 'auto'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : theme;
        document.documentElement.setAttribute('data-bs-theme', resolved);
        document.documentElement.setAttribute('data-theme-preference', theme);
        localStorage.setItem('theme', theme);
        themeOptions.forEach((item) => {
          item.classList.toggle('active', item.dataset.themeValue === theme);
        });
      };

      themeOptions.forEach((item) => {
        item.classList.toggle('active', item.dataset.themeValue === (localStorage.getItem('theme') || 'auto'));
        item.addEventListener('click', (event) => {
          event.preventDefault();
          applyTheme(item.dataset.themeValue);
        });
      });

      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if ((localStorage.getItem('theme') || 'auto') === 'auto') {
          applyTheme('auto');
        }
      });

      let es = null;
      let isPaused = false;
      let latestAccessLines = [];
      let latestErrorLines = [];
      let logFilter = '';
      let showLineNumbers = lineNumberCheckbox ? lineNumberCheckbox.checked : false;
      let wrapLines = wrapLinesCheckbox ? wrapLinesCheckbox.checked : false;

      function copyTextToClipboard(text) {
        if (!text) text = '';
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).catch(function (err) {
            console.error('Clipboard write failed', err);
          });
        } else {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.style.position = 'fixed';
          textarea.style.left = '-9999px';
          document.body.appendChild(textarea);
          textarea.focus();
          textarea.select();
          try {
            document.execCommand('copy');
          } catch (err) {
            console.error('execCommand copy failed', err);
          }
          document.body.removeChild(textarea);
        }
      }

      document.querySelectorAll('.copy-log-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const targetId = btn.dataset.target;
          const pre = document.getElementById(targetId);
          if (pre) {
            copyTextToClipboard(pre.textContent || '');
          }
        });
      });

      document.querySelectorAll('.copy-url-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const href = btn.dataset.href;
          if (!href) return;
          const url = new URL(href, window.location.href).toString();
          copyTextToClipboard(url);
        });
      });

      function setStatus(online) {
        if (!sseStatus) return;
        sseStatus.className = online
          ? 'badge bg-green-lt text-green-fg'
          : 'badge bg-red-lt text-red-fg';
        sseStatus.innerHTML = online
          ? '<i class="ti ti-activity-heartbeat me-1"></i>LIVE'
          : '<i class="ti ti-plug-connected-x me-1"></i>OFFLINE';
      }

      function updatePauseButton() {
        if (!pauseBtn) return;
        if (isPaused) {
          pauseBtn.className = 'btn btn-outline-secondary btn-sm';
          pauseBtn.innerHTML = '<i class="ti ti-player-play me-1"></i>Continue';
        } else {
          pauseBtn.className = 'btn btn-outline-danger btn-sm';
          pauseBtn.innerHTML = '<i class="ti ti-player-pause me-1"></i>Pause';
        }
      }

      function updateLimitLabels() {
        const limit = limitSelect.value;
        if (accessLimitLabel) accessLimitLabel.textContent = limit;
        if (errorLimitLabel) errorLimitLabel.textContent = limit;
      }

      function formatWithLineNumbers(lines) {
        const count = lines.length;
        const width = String(count > 0 ? count : 1).length;
        return lines.map(function (line, idx) {
          const no = String(idx + 1).padStart(width, ' ');
          return no + ' | ' + line;
        });
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function highlightAndEscape(line, filterRaw, filterLower) {
        const flen = filterRaw.length;
        if (!flen) {
          return escapeHtml(line);
        }
        const lowerLine = line.toLowerCase();
        let result = '';
        let index = 0;
        while (true) {
          const matchIndex = lowerLine.indexOf(filterLower, index);
          if (matchIndex === -1) {
            result += escapeHtml(line.slice(index));
            break;
          }
          result += escapeHtml(line.slice(index, matchIndex));
          result += '<mark>' +
            escapeHtml(line.slice(matchIndex, matchIndex + flen)) +
            '</mark>';
          index = matchIndex + flen;
        }
        return result;
      }

      function renderLines(preEl, lines, filterRaw, filterLower) {
        if (!preEl) return;
        const hasFilter = !!(filterLower && filterLower.length > 0);

        const htmlLines = lines.map(function (line) {
          if (!hasFilter) {
            return escapeHtml(line);
          }
          return highlightAndEscape(line, filterRaw, filterLower);
        });

        preEl.innerHTML = htmlLines.join('\n');
      }

      function scrollToEnd(preEl) {
        if (!preEl) return;
        preEl.scrollTop = preEl.scrollHeight;
      }

      function renderLogs() {
        if (!accessPre || !errorPre) return;

        const filterRaw = logFilter || '';
        const filterLower = filterRaw.toLowerCase();
        const accessBase = latestAccessLines;
        const errorBase = latestErrorLines;

        const accessFiltered = !filterLower ? accessBase : accessBase.filter(function (l) {
          return l.toLowerCase().includes(filterLower);
        });
        const errorFiltered = !filterLower ? errorBase : errorBase.filter(function (l) {
          return l.toLowerCase().includes(filterLower);
        });

        let accessDisplay = accessFiltered;
        let errorDisplay = errorFiltered;

        if (showLineNumbers) {
          accessDisplay = formatWithLineNumbers(accessFiltered);
          errorDisplay = formatWithLineNumbers(errorFiltered);
        }

        renderLines(accessPre, accessDisplay, filterRaw, filterLower);
        renderLines(errorPre, errorDisplay, filterRaw, filterLower);
        scrollToEnd(accessPre);
        scrollToEnd(errorPre);
      }

      function updateUrlParams() {
        const url = new URL(window.location.href);
        url.searchParams.set('limit', limitSelect.value);
        url.searchParams.set('refresh', refreshSelect.value);
        window.history.replaceState(null, '', url.toString());
      }

      function updateWrapMode() {
        if (!accessPre || !errorPre) return;
        accessPre.style.whiteSpace = wrapLines ? 'pre-wrap' : 'pre';
        errorPre.style.whiteSpace = wrapLines ? 'pre-wrap' : 'pre';
        accessPre.style.wordBreak = wrapLines ? 'break-all' : 'normal';
        errorPre.style.wordBreak = wrapLines ? 'break-all' : 'normal';
      }

      function effectiveStreamLimit() {
        const baseLimit = Number(limitSelect.value || 50);
        if (logFilter && logFilter.trim() !== '') {
          return Math.max(baseLimit, 500);
        }
        return baseLimit;
      }

      function startStream() {
        if (isPaused) {
          return;
        }

        if (es) {
          es.close();
          es = null;
        }

        const limit = String(effectiveStreamLimit());
        const interval = refreshSelect.value;
        updateLimitLabels();

        const params = new URLSearchParams({ limit, interval });
        const sseUrl = 'logs/stream?' + params.toString();

        try {
          es = new EventSource(sseUrl);
        } catch (e) {
          console.error('Failed to create EventSource', e);
          setStatus(false);
          return;
        }

        es.onmessage = function (event) {
          setStatus(true);
          try {
            const data = JSON.parse(event.data);
            if (Array.isArray(data.access)) {
              latestAccessLines = data.access.slice();
            }
            if (Array.isArray(data.error)) {
              latestErrorLines = data.error.slice();
            }
            renderLogs();
          } catch (e) {
            console.error('Failed to parse SSE payload', e);
          }
        };

        es.onerror = function (err) {
          console.error('SSE error', err);
          setStatus(false);
        };
      }

      limitSelect.addEventListener('change', function () {
        updateLimitLabels();
        updateUrlParams();
        if (!isPaused) {
          startStream();
        }
      });

      refreshSelect.addEventListener('change', function () {
        updateUrlParams();
        if (!isPaused) {
          startStream();
        }
      });

      if (filterInput) {
        filterInput.addEventListener('input', function () {
          const hadFilter = logFilter.trim() !== '';
          logFilter = filterInput.value || '';
          renderLogs();
          const hasFilter = logFilter.trim() !== '';
          if (hadFilter !== hasFilter && !isPaused) {
            startStream();
          }
        });
      }

      if (lineNumberCheckbox) {
        lineNumberCheckbox.addEventListener('change', function () {
          showLineNumbers = lineNumberCheckbox.checked;
          renderLogs();
        });
      }

      if (wrapLinesCheckbox) {
        wrapLinesCheckbox.addEventListener('change', function () {
          wrapLines = wrapLinesCheckbox.checked;
          updateWrapMode();
        });
      }

      pauseBtn.addEventListener('click', function () {
        if (!isPaused) {
          isPaused = true;
          updatePauseButton();
          if (es) {
            es.close();
            es = null;
          }
        } else {
          isPaused = false;
          updatePauseButton();
          startStream();
        }
      });

      if (accessPre && accessPre.textContent) {
        latestAccessLines = accessPre.textContent.split('\n');
      }
      if (errorPre && errorPre.textContent) {
        latestErrorLines = errorPre.textContent.split('\n');
      }

      updateLimitLabels();
      updatePauseButton();
      updateWrapMode();
      renderLogs();
      startStream();
    })();
  </script>
</body>
</html>
