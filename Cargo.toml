[package]
name = "nginx-logs-exporter"
version = "0.3.1"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prometheus = "0.14"
lazy_static = "1.5"
flate2 = "1.1"
async-stream = "0.3"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
